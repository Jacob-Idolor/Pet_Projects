# BetBoard — Daily Pick of the Day email (9 AM ET)
# Requires GitHub Secrets: ODDS_API_KEY, RESEND_API_KEY

name: Send Daily Pick Email

on:
  schedule:
    - cron: "0 14 * * *"   # 14:00 UTC = 9 AM Eastern (10 AM EDT)
  workflow_dispatch:       # Allow manual run from Actions tab

jobs:
  send-pick:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install requests python-dotenv
          pip install -r requirements_sports.txt

      - name: Run daily pick emailer
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: python send_daily_pick.py
