services:
  app:
    build:
      context: .
    ports:
      - "8000:8000"
    environment:
      ENVIRONMENT: staging
      ALLOWED_HOSTS: localhost,127.0.0.1
      TRADE_API_KEY: dev-trade-key
      TRADE_SIGNING_SECRET: dev-signing-secret-change-me
      STATE_DATABASE_URL: postgresql+psycopg://stockbuybot:stockbuybot@postgres:5432/stockbuybot
      AUDIT_LOG_PATH: /app/var/audit/trades.jsonl
      PORTFOLIO_DATA_PATH: /app/var/portfolio.json
      DASHBOARD_USE_BROKER_DATA: "true"
      METRICS_ENABLED: "true"
    volumes:
      - app-var:/app/var
    depends_on:
      - postgres

  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: stockbuybot
      POSTGRES_USER: stockbuybot
      POSTGRES_PASSWORD: stockbuybot
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  app-var:
  postgres-data:
