[project]
name = "stock-buy-bot"
version = "0.1.0"
description = "Production-ready groundwork for an automated stock buy bot"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.135.1",
  "jinja2==3.1.6",
  "uvicorn[standard]==0.42.0",
  "starlette==0.52.1",
  "pydantic-settings==2.13.1",
  "alpaca-py==0.43.2",
  "tenacity==9.1.4",
  "structlog==25.5.0",
  "sqlalchemy==2.0.48",
  "psycopg[binary]==3.3.3",
  "prometheus-client==0.24.1",
  "requests==2.32.4",
  "urllib3==2.6.3",
]

[project.optional-dependencies]
dev = [
  "pytest==8.4.0",
  "pytest-cov==7.0.0",
  "httpx==0.28.1",
  "ruff==0.13.0",
  "mypy==1.19.1",
  "pre-commit==4.5.1",
]

[build-system]
requires = ["setuptools>=69.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
stock_buy_bot = ["templates/*.html", "static/*.css", "static/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
packages = ["stock_buy_bot"]

[[tool.mypy.overrides]]
module = ["alpaca.*", "structlog"]
ignore_missing_imports = true

[tool.coverage.run]
source = ["stock_buy_bot"]

[tool.coverage.report]
show_missing = true
skip_covered = false
