repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.13.0
    hooks:
      - id: ruff-check
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.19.1
    hooks:
      - id: mypy
        additional_dependencies:
          - fastapi==0.135.1
          - starlette==0.52.1
          - pydantic-settings==2.13.1
          - sqlalchemy==2.0.48
          - prometheus-client==0.24.1
          - alpaca-py==0.43.2
          - structlog==25.5.0
        args:
          - --strict
          - src
          - tests

  - repo: local
    hooks:
      - id: pytest
        name: pytest
        entry: python -m pytest tests -p no:cacheprovider
        language: system
        pass_filenames: false
