<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Poker GTO Trainer</title>
    {% if ad_settings.ads_enabled %}
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client={{ ad_settings.ads_client }}" crossorigin="anonymous"></script>
    {% endif %}
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <header>
        <div class="brand">
            <h1>Poker GTO Trainer</h1>
            <p class="tagline">Intro to optimal decision making at the table</p>
        </div>
        <nav>
            <a href="{{ url_for('index') }}">Home</a>
            <a href="{{ url_for('ranges') }}">Ranges</a>
            <a href="{{ url_for('simulate') }}">Simulate</a>
            <a href="{{ url_for('metrics') }}">Metrics</a>
        </nav>
    </header>
    <main>
        {% block content %}{% endblock %}
    </main>
    <footer>
        <p>Built for quick study sessions. Shuffle often and think in ranges.</p>
    </footer>
</body>
</html>
