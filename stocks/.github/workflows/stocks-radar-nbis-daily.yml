name: StocksWatch — NBIS daily refresh and deploy

on:
  schedule:
    # 06:17 Pacific during standard time / 07:17 during daylight time.
    - cron: "17 14 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stockswatch-production
  cancel-in-progress: false

jobs:
  refresh-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      STOCKS_RADAR_ENV: production
      DEPLOY_PROVIDER: github-actions
      STOCKS_RADAR_SITE: https://stockswatch.cc
      SEC_CONTACT_EMAIL: ${{ secrets.SEC_CONTACT_EMAIL }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PUBLIC_ADSENSE_CLIENT: ${{ vars.PUBLIC_ADSENSE_CLIENT }}
      PUBLIC_ADSENSE_ENABLED: ${{ vars.PUBLIC_ADSENSE_ENABLED }}
      PUBLIC_ADSENSE_VERIFY_META: ${{ vars.PUBLIC_ADSENSE_VERIFY_META }}
      PUBLIC_ADSENSE_SLOT_HERO: ${{ vars.PUBLIC_ADSENSE_SLOT_HERO }}
      PUBLIC_ADSENSE_SLOT_BOARD: ${{ vars.PUBLIC_ADSENSE_SLOT_BOARD }}
      PUBLIC_ADSENSE_SLOT_FOOTER: ${{ vars.PUBLIC_ADSENSE_SLOT_FOOTER }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: radar/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install JavaScript dependencies
        working-directory: radar
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Install snapshot dependencies
        working-directory: radar
        run: python -m pip install --disable-pip-version-check -r scripts/datacenter/requirements.txt

      - name: Build and validate the daily snapshot
        working-directory: radar
        env:
          NBIS_STRICT: "1"
          SCREENER_STRICT: "1"
        run: npm run build

      - name: Scan the production bundle
        working-directory: radar
        run: npm run security:dist

      - name: Assert snapshot freshness and coverage
        working-directory: radar
        run: npm run freshness

      - name: Deploy to Cloudflare Pages
        working-directory: radar
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler@4 pages deploy dist --project-name=stockswatch-nbis --branch=main
