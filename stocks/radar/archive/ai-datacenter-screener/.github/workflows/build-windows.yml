name: Build Windows EXE

# Produces a real Windows .exe on a Windows runner (can't be built on macOS).
# Run it from the repo's Actions tab ("Run workflow"), or it triggers on a vX tag.

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-build.txt

      - name: Build EXE
        run: pyinstaller screener.spec --noconfirm --clean

      - name: Upload the .exe
        uses: actions/upload-artifact@v4
        with:
          name: AI-DataCenter-Screener-Windows
          path: dist/AI-DataCenter-Screener.exe
          if-no-files-found: error
