name: StocksWatch - legacy Python validation

# Retained research and private-pack regression checks, without installing the
# market-data dependency stack for ordinary J Sol page/style changes.
on:
  pull_request:
    paths:
      - "stocks/radar/scripts/datacenter/**"
      - "stocks/radar/scripts/fetch/**"
      - "stocks/radar/scripts/lib/nbis-quality.mjs"
      - "stocks/radar/scripts/lib/sanitize.mjs"
      - "stocks/radar/scripts/ops/validate-nbis-schema.mjs"
      - "stocks/radar/scripts/ops/package-workflow-pack.py"
      - "stocks/radar/tests/python/**"
      - "stocks/radar/src/data/nbis-profile.json"
      - "stocks/radar/src/data/datacenter-universe.json"
      - "stocks/radar/src/data/workflow-pack.json"
      - ".github/workflows/stocks-radar-legacy-validate.yml"
  push:
    branches: [main]
    paths:
      - "stocks/radar/scripts/datacenter/**"
      - "stocks/radar/scripts/fetch/**"
      - "stocks/radar/scripts/lib/nbis-quality.mjs"
      - "stocks/radar/scripts/lib/sanitize.mjs"
      - "stocks/radar/scripts/ops/validate-nbis-schema.mjs"
      - "stocks/radar/scripts/ops/package-workflow-pack.py"
      - "stocks/radar/tests/python/**"
      - "stocks/radar/src/data/nbis-profile.json"
      - "stocks/radar/src/data/datacenter-universe.json"
      - "stocks/radar/src/data/workflow-pack.json"
      - ".github/workflows/stocks-radar-legacy-validate.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  legacy-python:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: stocks/radar
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: python -m pip install --require-hashes -r scripts/datacenter/requirements.txt
      - run: python -m unittest discover -s tests/python
