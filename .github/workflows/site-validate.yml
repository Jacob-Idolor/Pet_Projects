name: Site validate

on:
  pull_request:
    paths:
      - "kubernetes/site/**"
      - "kubernetes/infra/**"
      - ".github/workflows/site-validate.yml"
  push:
    branches: [main]
    paths:
      - "kubernetes/site/**"
      - "kubernetes/infra/**"

jobs:
  regression:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kubernetes/site
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: kubernetes/site/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build + unit tests + link/security checks + npm audit
        run: npm run test:ci

      - name: Install Playwright browser
        run: npx playwright install chromium --with-deps

      - name: E2E smoke tests
        run: npm run test:e2e

  terraform-validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kubernetes/infra/terraform
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.0"

      - run: terraform init -backend=false
      - run: terraform validate
      - run: terraform fmt -check
