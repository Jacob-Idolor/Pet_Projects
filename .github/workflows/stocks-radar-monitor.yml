name: Stocks Radar — public freshness monitor

on:
  workflow_dispatch:
  schedule:
    # Independent of AWS credentials. Weekday check catches a stopped refresh pipeline.
    - cron: "5 17 * * 1-5"

permissions:
  contents: read

jobs:
  freshness:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: stocks/radar/package-lock.json
      - name: Install validation dependencies
        working-directory: stocks/radar
        run: npm ci --omit=optional
      - name: Check public data freshness
        working-directory: stocks/radar
        env:
          # Covers the Friday-to-Monday market closure while still detecting a stopped pipeline.
          QUOTES_MAX_AGE_HOURS: "72"
          SCREENER_MAX_AGE_HOURS: "72"
          SCREENER_MIN_OK_RATIO: "0.85"
          QUOTES_MIN_OK_RATIO: "0.85"
        run: node scripts/ops/check-live-freshness.mjs --url https://stockswatch.cc
