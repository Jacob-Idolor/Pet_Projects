name: Stocks Radar — validate

on:
  pull_request:
    paths:
      - "stocks/radar/**"
      - "stocks/radar/infra/terraform/**"
      - ".github/workflows/stocks-radar-*.yml"
  push:
    branches: [main]
    paths:
      - "stocks/radar/**"
      - "stocks/radar/infra/terraform/**"
      - ".github/workflows/stocks-radar-*.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: stocks/radar
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: stocks/radar/package-lock.json
      - run: npm ci
      - name: Audit npm dependencies
        run: npm audit --omit=optional --audit-level=high
      - run: npm run config:validate
      - run: npm test
      - run: npm run screener:schema
      - name: Generate Astro types
        run: npx astro sync
      - run: npm run typecheck
      - run: npm run build
        env:
          STOCKS_RADAR_BASE: /
          STOCKS_RADAR_SITE: https://stockswatch.cc
          STOCKS_RADAR_ENV: development
          SCREENER_SKIP: "1"
          QUOTES_SKIP: "1"
      - name: Scan built bundle for credentials
        run: npm run security:dist
      - run: npm run adsense:checklist
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          CI: "true"

  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: stocks/radar/infra/terraform
    steps:
      - uses: actions/checkout@v5
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.0"
      - run: terraform init -backend=false
      - run: terraform validate
      - run: terraform fmt -check -recursive
