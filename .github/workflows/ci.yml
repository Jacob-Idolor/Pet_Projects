name: CI

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f Dynatrace/requirements.txt ]; then pip install -r Dynatrace/requirements.txt; fi
      - name: Run pytest
        run: |
          if [ -d Dynatrace/tests ]; then pytest Dynatrace/tests; fi
      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'
      - name: Run Go tests
        run: go test ./...

  stock-buy-bot:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: stock-buy-bot
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.12'
      - name: Install stock-buy-bot dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Run Ruff
        run: python -m ruff check .
      - name: Run MyPy
        run: python -m mypy --strict src tests
      - name: Run pytest with coverage
        run: python -m pytest tests --cov=stock_buy_bot --cov-report=term-missing --cov-fail-under=85 -p no:cacheprovider
