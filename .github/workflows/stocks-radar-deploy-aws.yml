name: Stocks Radar — AWS deploy (manual)

# Manual only — avoids surprise AWS charges on every push
on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: stocks/radar/package-lock.json

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Build site
        working-directory: stocks/radar
        env:
          STOCKS_RADAR_BASE: /
          STOCKS_RADAR_SITE: https://${{ secrets.STOCKS_RADAR_CLOUDFRONT_DOMAIN }}
        run: |
          npm ci
          npm run build

      - name: Sync to S3
        run: |
          aws s3 sync stocks/radar/dist s3://${{ secrets.STOCKS_RADAR_S3_BUCKET }} --delete

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.STOCKS_RADAR_CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*"
