name: Site deploy GitHub Pages (manual, $0)

# FREE hosting for public repos — no AWS bill.
# Enable: repo Settings → Pages → Source: GitHub Actions
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kubernetes/site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: kubernetes/site/package-lock.json
      - run: npm ci
      - run: npm run test:ci
      - run: npx playwright install chromium --with-deps
      - run: npm run test:e2e

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: kubernetes/site/package-lock.json
      - run: npm ci
        working-directory: kubernetes/site
      - run: npm run build
        working-directory: kubernetes/site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: kubernetes/site/dist
      - id: deployment
        uses: actions/deploy-pages@v4
