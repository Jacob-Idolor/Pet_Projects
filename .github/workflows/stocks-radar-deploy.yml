name: Stocks Radar — deploy

# PAUSED — AWS secrets / CloudFront stack not configured.
# Re-enable after terraform apply + GitHub secrets (DEPLOY.md):
#   - set job if to true
#   - restore:
# on:
#   push:
#     branches: [main]
#     paths: [stocks/radar/**]
#   schedule:
#     - cron: "0 15 * * 1-5"   # weekday mid-day ET rebuild (optional; prefer refresh-quotes for prices)
#   workflow_dispatch:
on:
  workflow_dispatch:

concurrency:
  group: stocks-radar-deploy
  cancel-in-progress: true

jobs:
  deploy:
    # Flip to true when secrets + live CloudFront exist again.
    if: ${{ false }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    environment:
      name: stockwatch
      url: ${{ steps.site.outputs.url }}
    env:
      SITE_URL: https://${{ secrets.STOCKS_RADAR_CLOUDFRONT_DOMAIN }}
    steps:
      - name: Require AWS deploy secrets
        run: |
          missing=0
          for key in AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_REGION \
            STOCKS_RADAR_S3_BUCKET STOCKS_RADAR_CLOUDFRONT_DISTRIBUTION_ID \
            STOCKS_RADAR_CLOUDFRONT_DOMAIN; do
            if [ -z "${!key}" ]; then
              echo "::error title=Missing secret::$key — see stocks/radar/DEPLOY.md"
              missing=1
            fi
          done
          [ "$missing" -eq 0 ] || exit 1
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          STOCKS_RADAR_S3_BUCKET: ${{ secrets.STOCKS_RADAR_S3_BUCKET }}
          STOCKS_RADAR_CLOUDFRONT_DISTRIBUTION_ID: ${{ secrets.STOCKS_RADAR_CLOUDFRONT_DISTRIBUTION_ID }}
          STOCKS_RADAR_CLOUDFRONT_DOMAIN: ${{ secrets.STOCKS_RADAR_CLOUDFRONT_DOMAIN }}

      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: stocks/radar/package-lock.json

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Install & build
        working-directory: stocks/radar
        env:
          STOCKS_RADAR_BASE: /
          STOCKS_RADAR_SITE: ${{ env.SITE_URL }}
          DEPLOY_PROVIDER: github-actions
          DEPLOY_TIME: ${{ github.event.head_commit.timestamp || github.run_started_at }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          PUBLIC_ADSENSE_CLIENT: ${{ vars.PUBLIC_ADSENSE_CLIENT }}
          PUBLIC_ADSENSE_ENABLED: ${{ vars.PUBLIC_ADSENSE_ENABLED }}
          PUBLIC_ADSENSE_SLOT_HERO: ${{ vars.PUBLIC_ADSENSE_SLOT_HERO }}
          PUBLIC_ADSENSE_SLOT_BOARD: ${{ vars.PUBLIC_ADSENSE_SLOT_BOARD }}
          PUBLIC_ADSENSE_SLOT_FOOTER: ${{ vars.PUBLIC_ADSENSE_SLOT_FOOTER }}
        run: |
          npm ci
          npm run build

      - name: Sync to S3 (tiered cache)
        working-directory: stocks/radar
        run: DIST_DIR=dist ./infra/sync-s3-tiered.sh "${{ secrets.STOCKS_RADAR_S3_BUCKET }}"

      - name: Invalidate CloudFront (HTML + live JSON)
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ secrets.STOCKS_RADAR_CLOUDFRONT_DISTRIBUTION_ID }}" \
          --paths "/" "/index.html" "/404.html" "/quotes.json" "/build-meta.json" \
                 "/health.json" "/settings.json" \
                 "/ads.txt" "/robots.txt" "/sitemap.xml" "/watchlist-board.mjs"

      - id: site
        name: Live site URL
        run: echo "url=${SITE_URL}" >> "$GITHUB_OUTPUT"

      - name: Deployment summary
        run: |
          echo "## Stocks Radar deployed" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**URL:** ${SITE_URL}" >> "$GITHUB_STEP_SUMMARY"
          echo "**Commit:** \`${GITHUB_SHA::7}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "**Run:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" >> "$GITHUB_STEP_SUMMARY"
