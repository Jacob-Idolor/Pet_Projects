name: Stocks Radar — deploy

# Enable by setting repo variable STOCKS_RADAR_DEPLOY_ENABLED=true
# after terraform apply + secrets (see stocks/radar/GO_LIVE.md).

on:
  push:
    branches: [main]
    paths:
      - "stocks/radar/**"
      - ".github/workflows/stocks-radar-deploy.yml"
  workflow_dispatch:
  # Full rebuild weekday midday UTC (quotes also refresh via dedicated workflow)
  schedule:
    - cron: "0 15 * * 1-5"

concurrency:
  group: stocks-radar-deploy
  cancel-in-progress: true

jobs:
  deploy:
    if: ${{ vars.STOCKS_RADAR_DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    environment:
      name: stockwatch
      url: ${{ steps.site.outputs.url }}
    steps:
      - name: Require AWS deploy secrets
        run: |
          missing=0
          for key in AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_REGION \
            STOCKS_RADAR_S3_BUCKET STOCKS_RADAR_CLOUDFRONT_DISTRIBUTION_ID \
            STOCKS_RADAR_CLOUDFRONT_DOMAIN; do
            if [ -z "${!key}" ]; then
              echo "::error title=Missing secret::$key — run stocks/radar/infra/go-live.sh"
              missing=1
            fi
          done
          [ "$missing" -eq 0 ] || exit 1
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          STOCKS_RADAR_S3_BUCKET: ${{ secrets.STOCKS_RADAR_S3_BUCKET }}
          STOCKS_RADAR_CLOUDFRONT_DISTRIBUTION_ID: ${{ secrets.STOCKS_RADAR_CLOUDFRONT_DISTRIBUTION_ID }}
          STOCKS_RADAR_CLOUDFRONT_DOMAIN: ${{ secrets.STOCKS_RADAR_CLOUDFRONT_DOMAIN }}

      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: stocks/radar/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install screener Python deps
        working-directory: stocks/radar
        run: pip install -r scripts/datacenter/requirements.txt

      - name: Resolve public site URL
        id: url
        env:
          STOCKS_RADAR_SITE: ${{ vars.STOCKS_RADAR_SITE }}
          CF_DOMAIN: ${{ secrets.STOCKS_RADAR_CLOUDFRONT_DOMAIN }}
        run: |
          if [ -n "${STOCKS_RADAR_SITE:-}" ]; then
            echo "site=${STOCKS_RADAR_SITE%/}" >> "$GITHUB_OUTPUT"
          elif [ -n "${CF_DOMAIN:-}" ]; then
            echo "site=https://${CF_DOMAIN}" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Set variable STOCKS_RADAR_SITE or secret STOCKS_RADAR_CLOUDFRONT_DOMAIN"
            exit 1
          fi

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Install & build
        working-directory: stocks/radar
        env:
          STOCKS_RADAR_BASE: /
          STOCKS_RADAR_SITE: ${{ steps.url.outputs.site }}
          STOCKS_RADAR_ENV: ${{ vars.STOCKS_RADAR_ENV || 'production' }}
          DEPLOY_PROVIDER: github-actions
          DEPLOY_TIME: ${{ github.event.head_commit.timestamp || github.run_started_at }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          PUBLIC_ADSENSE_CLIENT: ${{ vars.PUBLIC_ADSENSE_CLIENT }}
          PUBLIC_ADSENSE_ENABLED: ${{ vars.PUBLIC_ADSENSE_ENABLED }}
          PUBLIC_ADSENSE_SLOT_HERO: ${{ vars.PUBLIC_ADSENSE_SLOT_HERO }}
          PUBLIC_ADSENSE_SLOT_BOARD: ${{ vars.PUBLIC_ADSENSE_SLOT_BOARD }}
          PUBLIC_ADSENSE_SLOT_FOOTER: ${{ vars.PUBLIC_ADSENSE_SLOT_FOOTER }}
          PUBLIC_ADSENSE_VERIFY_META: ${{ vars.PUBLIC_ADSENSE_VERIFY_META }}
          # Never bake local AdSense preview boxes into the live site
          PUBLIC_ADSENSE_PREVIEW: "false"
          # Free Web3Forms key — emails friend suggestions to the list owner (optional)
          PUBLIC_WEB3FORMS_ACCESS_KEY: ${{ vars.PUBLIC_WEB3FORMS_ACCESS_KEY || secrets.PUBLIC_WEB3FORMS_ACCESS_KEY }}
          # Telemetry opt-in only — leave unset unless you intentionally enable otelScripts
          OTEL_SDK_DISABLED: "true"
          OTEL_EXPORTER_OTLP_ENDPOINT: ""
        run: |
          npm ci
          if [ "${STOCKS_RADAR_ENV}" = "production" ]; then
            npm run config:validate:prod
          else
            npm run config:validate
          fi
          npm run build

      - name: Sync to S3 (tiered cache)
        working-directory: stocks/radar
        run: DIST_DIR=dist ./infra/sync-s3-tiered.sh "${{ secrets.STOCKS_RADAR_S3_BUCKET }}"

      - name: Invalidate CloudFront (HTML + live JSON)
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ secrets.STOCKS_RADAR_CLOUDFRONT_DISTRIBUTION_ID }}" \
            --paths "/" "/index.html" "/404.html" "/quotes.json" "/screener.json" \
                   "/datacenter.html" "/datacenter/*" "/build-meta.json" \
                   "/health.json" "/settings.json" \
                   "/ads.txt" "/robots.txt" "/sitemap.xml" "/watchlist-board.mjs"

      - id: site
        name: Live site URL
        run: echo "url=${{ steps.url.outputs.site }}" >> "$GITHUB_OUTPUT"

      - name: Post-deploy health check
        run: |
          set -euo pipefail
          url="${{ steps.url.outputs.site }}"
          url="${url%/}"
          # CloudFront may lag briefly after invalidation
          sleep 12
          for path in /health.json /settings.json /quotes.json /screener.json /datacenter.html /; do
            code=$(curl -sS -o /tmp/body -w "%{http_code}" --retry 5 --retry-delay 4 --retry-all-errors "$url$path" || echo "000")
            echo "$path → HTTP $code"
            if [ "$code" != "200" ]; then
              echo "::error::$path returned $code"
              exit 1
            fi
          done
          curl -fsS "$url/health.json" -o /tmp/health.json
          node -e '
            const h = JSON.parse(require("fs").readFileSync("/tmp/health.json","utf8"));
            const good = h.ok === true || h.status === "ok";
            if (!good) { console.error("health not ok", h); process.exit(1); }
            console.log("health ok:", h.status, h.generatedAt || h.builtAt || "");
          '
          echo "## Health OK" >> "$GITHUB_STEP_SUMMARY"
          echo "\`$url/health.json\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Deployment summary
        run: |
          echo "## Stocks Radar deployed" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**URL:** ${{ steps.url.outputs.site }}" >> "$GITHUB_STEP_SUMMARY"
          echo "**Commit:** \`${GITHUB_SHA::7}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "**Run:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" >> "$GITHUB_STEP_SUMMARY"
