name: Jacob Builds - publish manually

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stocks-radar-nbis-production
  cancel-in-progress: true

jobs:
  refresh-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: stocks/radar
    env:
      DEPLOY_PROVIDER: github-actions
      STOCKS_RADAR_ENV: production
      STOCKS_RADAR_SITE: https://stockswatch.cc
      STOCKS_RADAR_BASE: /
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: stocks/radar/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Audit npm dependencies
        run: npm run security:deps

      - name: Validate source
        run: |
          npm run typecheck
          npm test

      - name: Build static site
        run: npm run build
        env:
          SCREENER_SKIP: "1"
          NBIS_SKIP: "1"
          QUOTES_SKIP: "1"

      - name: Verify static release
        run: npm run verify:dist

      - name: Scan built bundle for credentials
        run: npm run security:dist

      - name: Verify static publishing policy
        run: npm run policy:dist

      - name: Install Playwright Chromium
        run: npx --no-install playwright install --with-deps chromium

      - name: Verify reader journey
        run: npm run test:e2e
        env:
          CI: "true"

      - name: Deploy to Cloudflare Pages
        run: npx --no-install wrangler pages deploy dist --project-name stockswatch-nbis --branch main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Verify deployed pages and revision
        env:
          EXPECTED_GIT_SHA: ${{ github.sha }}
        run: |
          for attempt in 1 2 3 4; do
            if npm run freshness:live -- https://stockswatch.cc; then
              exit 0
            fi
            sleep 15
          done
          exit 1
