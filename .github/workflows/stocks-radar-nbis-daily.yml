name: StocksWatch — NBIS daily refresh and deploy

on:
  push:
    branches: [main]
    paths:
      - "stocks/radar/**"
      - ".github/workflows/stocks-radar-nbis-daily.yml"
  schedule:
    - cron: "30 22 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stocks-radar-nbis-production
  cancel-in-progress: true

jobs:
  refresh-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: stocks/radar
    env:
      DEPLOY_PROVIDER: github-actions
      STOCKS_RADAR_ENV: production
      STOCKS_RADAR_SITE: https://stockswatch.cc
      STOCKS_RADAR_BASE: /
      SEC_CONTACT_EMAIL: ${{ secrets.SEC_CONTACT_EMAIL }}
      # Public build-time configuration; unset values keep monetization off.
      PUBLIC_ADSENSE_CLIENT: ${{ vars.PUBLIC_ADSENSE_CLIENT }}
      PUBLIC_ADSENSE_CONSENT_READY: ${{ vars.PUBLIC_ADSENSE_CONSENT_READY }}
      PUBLIC_ADSENSE_ENABLED: ${{ vars.PUBLIC_ADSENSE_ENABLED }}
      PUBLIC_ADSENSE_SLOT_BOARD: ${{ vars.PUBLIC_ADSENSE_SLOT_BOARD }}
      PUBLIC_ADSENSE_SLOT_FOOTER: ${{ vars.PUBLIC_ADSENSE_SLOT_FOOTER }}
      PUBLIC_ADSENSE_SLOT_HERO: ${{ vars.PUBLIC_ADSENSE_SLOT_HERO }}
      PUBLIC_ADSENSE_VERIFY_META: ${{ vars.PUBLIC_ADSENSE_VERIFY_META }}
      PUBLIC_ADSENSE_ALLOW_HERO: ${{ vars.PUBLIC_ADSENSE_ALLOW_HERO }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: stocks/radar/package-lock.json

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --require-hashes -r scripts/datacenter/requirements.txt
          npm ci

      - name: Audit npm dependencies
        run: npm run security:deps

      - name: Validate source
        run: |
          npm run typecheck
          npm test

      - name: Fetch strict NBIS snapshot
        run: npm run update-nbis
        env:
          NBIS_STRICT: "1"

      - name: Validate NBIS snapshot
        run: npm run nbis:quality

      - name: Build static site
        run: npm run build
        env:
          SCREENER_SKIP: "1"
          NBIS_SKIP: "1"
          QUOTES_SKIP: "1"

      - name: Verify static release
        run: npm run verify:dist

      - name: Scan built bundle for credentials
        run: npm run security:dist

      - name: Deploy to Cloudflare Pages
        run: npx --no-install wrangler pages deploy dist --project-name stockswatch-nbis --branch main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Verify deployed revision and freshness
        env:
          EXPECTED_GIT_SHA: ${{ github.sha }}
        run: |
          for attempt in 1 2 3 4; do
            if npm run freshness:live -- https://stockswatch.cc; then
              exit 0
            fi
            sleep 15
          done
          exit 1
