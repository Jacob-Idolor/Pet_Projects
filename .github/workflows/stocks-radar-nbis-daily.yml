name: StocksWatch — NBIS daily refresh and deploy

on:
  schedule:
    - cron: "30 22 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stocks-radar-nbis-production
  cancel-in-progress: true

jobs:
  refresh-and-deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: stocks/radar
    env:
      STOCKS_RADAR_ENV: production
      STOCKS_RADAR_SITE: https://stockswatch.cc
      STOCKS_RADAR_BASE: /
      SEC_CONTACT_EMAIL: ${{ secrets.SEC_CONTACT_EMAIL }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: stocks/radar/package-lock.json

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install -r scripts/datacenter/requirements.txt
          npm ci

      - name: Fetch strict NBIS snapshot
        run: npm run update-nbis
        env:
          NBIS_STRICT: "1"

      - name: Validate NBIS snapshot
        run: npm run nbis:schema

      - name: Build static site
        run: npm run build
        env:
          SCREENER_SKIP: "1"
          NBIS_SKIP: "1"
          QUOTES_SKIP: "1"

      - name: Deploy to Cloudflare Pages
        run: npx --yes wrangler@4 pages deploy dist --project-name stockswatch-nbis --branch main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
