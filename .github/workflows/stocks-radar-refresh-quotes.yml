name: Stocks Radar — refresh quotes

# Enable with STOCKS_RADAR_DEPLOY_ENABLED=true (same flag as deploy).
# Mid-session: quotes + outlook only (cheap).
# Near-close + manual: also refresh screener + DC news (Yahoo-heavy).

on:
  workflow_dispatch:
  schedule:
    # Weekdays 14:30 UTC ≈ 10:30 ET — mid-session (quotes only)
    - cron: "30 14 * * 1-5"
    # Weekdays 20:15 UTC ≈ 16:15 ET — near close (quotes + screener)
    - cron: "15 20 * * 1-5"

concurrency:
  # Share with deploy so weekday refresh cannot race a main deploy's S3 sync
  group: stocks-radar-aws-mutate
  cancel-in-progress: false

jobs:
  refresh:
    if: ${{ vars.STOCKS_RADAR_DEPLOY_ENABLED == 'true' && (github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    environment: stockwatch
    steps:
      - name: Require deploy config
        run: |
          missing=0
          for key in AWS_REGION STOCKS_RADAR_S3_BUCKET STOCKS_RADAR_CLOUDFRONT_DISTRIBUTION_ID \
            STOCKS_RADAR_CLOUDFRONT_DOMAIN; do
            if [ -z "${!key}" ]; then
              echo "::error title=Missing secret::$key — see stocks/radar/GO_LIVE.md"
              missing=1
            fi
          done
          [ "$missing" -eq 0 ] || exit 1
        env:
          AWS_REGION: ${{ secrets.AWS_REGION }}
          STOCKS_RADAR_S3_BUCKET: ${{ secrets.STOCKS_RADAR_S3_BUCKET }}
          STOCKS_RADAR_CLOUDFRONT_DISTRIBUTION_ID: ${{ secrets.STOCKS_RADAR_CLOUDFRONT_DISTRIBUTION_ID }}
          STOCKS_RADAR_CLOUDFRONT_DOMAIN: ${{ secrets.STOCKS_RADAR_CLOUDFRONT_DOMAIN }}

      - name: Decide refresh scope
        id: scope
        run: |
          # Mid-session cron skips screener (~80 Yahoo calls). Near-close + manual include it.
          refresh_screener=false
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "${{ github.event.schedule }}" = "15 20 * * 1-5" ]; then
            refresh_screener=true
          fi
          echo "screener=$refresh_screener" >> "$GITHUB_OUTPUT"
          echo "Refresh screener: $refresh_screener"

      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: stocks/radar/package-lock.json

      - uses: actions/setup-python@v5
        if: steps.scope.outputs.screener == 'true'
        with:
          python-version: "3.12"

      - name: Configure AWS credentials
        uses: ./.github/actions/stocks-radar-aws
        with:
          aws-region: ${{ secrets.AWS_REGION }}
          use-oidc: ${{ vars.STOCKS_RADAR_USE_OIDC == 'true' && 'true' || 'false' }}
          role-arn: ${{ secrets.AWS_ROLE_ARN }}
          access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: Fetch quotes (+ screener when in scope)
        working-directory: stocks/radar
        env:
          OTEL_EXPORTER_OTLP_ENDPOINT: ${{ vars.OTEL_EXPORTER_OTLP_ENDPOINT }}
          OTEL_EXPORTER_OTLP_HEADERS: ${{ secrets.OTEL_EXPORTER_OTLP_HEADERS }}
          REFRESH_SCREENER: ${{ steps.scope.outputs.screener }}
        run: |
          npm ci --omit=optional
          npm run update-quotes
          if [ "$REFRESH_SCREENER" = "true" ]; then
            pip install -r scripts/datacenter/requirements.txt
            npm run update-screener
          else
            echo "Mid-session: skipped screener/news (runs near-close + workflow_dispatch)"
          fi
          node scripts/write-health.mjs

      - name: Sync live JSON to S3
        env:
          REFRESH_SCREENER: ${{ steps.scope.outputs.screener }}
          BUCKET: ${{ secrets.STOCKS_RADAR_S3_BUCKET }}
        run: |
          aws s3 cp stocks/radar/public/quotes.json \
            "s3://${BUCKET}/quotes.json" \
            --cache-control "public,max-age=0,no-cache,no-store,must-revalidate" \
            --content-type "application/json"
          if [ -f stocks/radar/public/outlook.json ]; then
            aws s3 cp stocks/radar/public/outlook.json \
              "s3://${BUCKET}/outlook.json" \
              --cache-control "public,max-age=0,no-cache,no-store,must-revalidate" \
              --content-type "application/json"
          fi
          if [ -f stocks/radar/public/health.json ]; then
            aws s3 cp stocks/radar/public/health.json \
              "s3://${BUCKET}/health.json" \
              --cache-control "public,max-age=0,no-cache,no-store,must-revalidate" \
              --content-type "application/json"
          fi
          # Never upload checkout copies of screener/news on mid-session — would clobber live data
          if [ "$REFRESH_SCREENER" = "true" ]; then
            aws s3 cp stocks/radar/public/screener.json \
              "s3://${BUCKET}/screener.json" \
              --cache-control "public,max-age=0,no-cache,no-store,must-revalidate" \
              --content-type "application/json"
            if [ -f stocks/radar/public/dc-movers.json ]; then
              aws s3 cp stocks/radar/public/dc-movers.json \
                "s3://${BUCKET}/dc-movers.json" \
                --cache-control "public,max-age=0,no-cache,no-store,must-revalidate" \
                --content-type "application/json"
            fi
            if [ -f stocks/radar/public/datacenter/news.json ]; then
              aws s3 cp stocks/radar/public/datacenter/news.json \
                "s3://${BUCKET}/datacenter/news.json" \
                --cache-control "public,max-age=0,no-cache,no-store,must-revalidate" \
                --content-type "application/json"
            fi
          fi

      - name: Invalidate CloudFront (cacheable live JSON only)
        env:
          REFRESH_SCREENER: ${{ steps.scope.outputs.screener }}
          DIST_ID: ${{ secrets.STOCKS_RADAR_CLOUDFRONT_DISTRIBUTION_ID }}
        run: |
          # quotes/health use CachingDisabled — invalidation is unnecessary spend
          paths=("/outlook.json")
          if [ "$REFRESH_SCREENER" = "true" ]; then
            paths+=("/screener.json" "/dc-movers.json" "/datacenter/news.json")
          fi
          aws cloudfront create-invalidation \
            --distribution-id "$DIST_ID" \
            --paths "${paths[@]}"

      - name: Resolve public site URL
        id: url
        env:
          STOCKS_RADAR_SITE: ${{ vars.STOCKS_RADAR_SITE }}
          CF_DOMAIN: ${{ secrets.STOCKS_RADAR_CLOUDFRONT_DOMAIN }}
        run: |
          if [ -n "${STOCKS_RADAR_SITE:-}" ]; then
            echo "site=${STOCKS_RADAR_SITE%/}" >> "$GITHUB_OUTPUT"
          elif [ -n "${CF_DOMAIN:-}" ]; then
            echo "site=https://${CF_DOMAIN}" >> "$GITHUB_OUTPUT"
          else
            echo "site=" >> "$GITHUB_OUTPUT"
          fi

      - name: Live freshness assert
        if: ${{ steps.url.outputs.site != '' }}
        working-directory: stocks/radar
        env:
          QUOTES_MAX_AGE_HOURS: "12"
          SCREENER_MAX_AGE_HOURS: "24"
          SCREENER_MIN_OK_RATIO: "0.85"
        run: |
          sleep 8
          node scripts/check-live-freshness.mjs --url "${{ steps.url.outputs.site }}"

      - name: Summary
        env:
          SITE_URL: ${{ steps.url.outputs.site }}
          REFRESH_SCREENER: ${{ steps.scope.outputs.screener }}
        run: |
          echo "## Quotes refreshed" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Site:** ${SITE_URL:-"(set STOCKS_RADAR_SITE)"}" >> "$GITHUB_STEP_SUMMARY"
          echo "**Screener this run:** $REFRESH_SCREENER" >> "$GITHUB_STEP_SUMMARY"
          node -e "const q=require('./stocks/radar/public/quotes.json'); console.log('Coverage:', (q.freshCount??q.count)+'/'+q.total, 'fresh'); console.log('Fetched:', q.fetchedAt||q.updatedAt);" >> "$GITHUB_STEP_SUMMARY"
