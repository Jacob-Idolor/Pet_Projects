name: Stocks Radar — refresh quotes

# Enable with STOCKS_RADAR_DEPLOY_ENABLED=true (same flag as deploy).

on:
  workflow_dispatch:
  schedule:
    # Weekdays 14:30 UTC ≈ 10:30 ET — mid-session
    - cron: "30 14 * * 1-5"
    # Weekdays 20:15 UTC ≈ 16:15 ET — near close
    - cron: "15 20 * * 1-5"

concurrency:
  group: stocks-radar-quotes
  cancel-in-progress: true

jobs:
  refresh:
    if: ${{ vars.STOCKS_RADAR_DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Require AWS deploy secrets
        run: |
          missing=0
          for key in AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_REGION \
            STOCKS_RADAR_S3_BUCKET STOCKS_RADAR_CLOUDFRONT_DISTRIBUTION_ID \
            STOCKS_RADAR_CLOUDFRONT_DOMAIN; do
            if [ -z "${!key}" ]; then
              echo "::error title=Missing secret::$key — see stocks/radar/GO_LIVE.md"
              missing=1
            fi
          done
          [ "$missing" -eq 0 ] || exit 1
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          STOCKS_RADAR_S3_BUCKET: ${{ secrets.STOCKS_RADAR_S3_BUCKET }}
          STOCKS_RADAR_CLOUDFRONT_DISTRIBUTION_ID: ${{ secrets.STOCKS_RADAR_CLOUDFRONT_DISTRIBUTION_ID }}
          STOCKS_RADAR_CLOUDFRONT_DOMAIN: ${{ secrets.STOCKS_RADAR_CLOUDFRONT_DOMAIN }}

      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: stocks/radar/package-lock.json

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Fetch quotes
        working-directory: stocks/radar
        env:
          OTEL_EXPORTER_OTLP_ENDPOINT: ${{ vars.OTEL_EXPORTER_OTLP_ENDPOINT }}
          OTEL_EXPORTER_OTLP_HEADERS: ${{ secrets.OTEL_EXPORTER_OTLP_HEADERS }}
        run: |
          npm ci
          npm run update-quotes

      - name: Sync quotes.json to S3
        run: |
          aws s3 cp stocks/radar/public/quotes.json \
            "s3://${{ secrets.STOCKS_RADAR_S3_BUCKET }}/quotes.json" \
            --cache-control "public,max-age=0,no-cache,no-store,must-revalidate" \
            --content-type "application/json"

      - name: Invalidate CloudFront quotes
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ secrets.STOCKS_RADAR_CLOUDFRONT_DISTRIBUTION_ID }}" \
            --paths "/quotes.json"

      - name: Resolve public site URL
        id: url
        env:
          STOCKS_RADAR_SITE: ${{ vars.STOCKS_RADAR_SITE }}
          CF_DOMAIN: ${{ secrets.STOCKS_RADAR_CLOUDFRONT_DOMAIN }}
        run: |
          if [ -n "${STOCKS_RADAR_SITE:-}" ]; then
            echo "site=${STOCKS_RADAR_SITE%/}" >> "$GITHUB_OUTPUT"
          elif [ -n "${CF_DOMAIN:-}" ]; then
            echo "site=https://${CF_DOMAIN}" >> "$GITHUB_OUTPUT"
          else
            echo "site=" >> "$GITHUB_OUTPUT"
          fi

      - name: Summary
        env:
          SITE_URL: ${{ steps.url.outputs.site }}
        run: |
          echo "## Quotes refreshed" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Site:** ${SITE_URL:-"(set STOCKS_RADAR_SITE)"}" >> "$GITHUB_STEP_SUMMARY"
          echo "**Paths invalidated:** \`/quotes.json\`" >> "$GITHUB_STEP_SUMMARY"
          node -e "const q=require('./stocks/radar/public/quotes.json'); console.log('Coverage:', q.count+'/'+q.total, q.partial?'(partial)':''); console.log('Fetched:', q.fetchedAt||q.updatedAt);" >> "$GITHUB_STEP_SUMMARY"
