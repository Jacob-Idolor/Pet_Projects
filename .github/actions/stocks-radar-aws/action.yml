# Shared AWS auth for StocksWatch workflows.
# Prefer OIDC (STOCKS_RADAR_USE_OIDC=true + AWS_ROLE_ARN) over long-lived access keys.

name: Configure StocksWatch AWS
description: Authenticate to AWS via GitHub OIDC role or access keys

inputs:
  aws-region:
    description: AWS region
    required: true
  role-arn:
    description: IAM role ARN for OIDC (optional if using keys)
    required: false
    default: ""
  access-key-id:
    description: Access key id (legacy)
    required: false
    default: ""
  secret-access-key:
    description: Secret access key (legacy)
    required: false
    default: ""
  use-oidc:
    description: "true to require OIDC role"
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Require AWS auth material
      shell: bash
      env:
        USE_OIDC: ${{ inputs.use-oidc }}
        ROLE_ARN: ${{ inputs.role-arn }}
        AWS_ACCESS_KEY_ID: ${{ inputs.access-key-id }}
        AWS_SECRET_ACCESS_KEY: ${{ inputs.secret-access-key }}
        AWS_REGION: ${{ inputs.aws-region }}
      run: |
        set -euo pipefail
        if [ -z "${AWS_REGION}" ]; then
          echo "::error::AWS region missing"
          exit 1
        fi
        if [ "${USE_OIDC}" = "true" ]; then
          if [ -z "${ROLE_ARN}" ]; then
            echo "::error::STOCKS_RADAR_USE_OIDC=true but AWS_ROLE_ARN secret is empty"
            exit 1
          fi
          echo "Auth mode: OIDC → ${ROLE_ARN}"
        else
          if [ -z "${AWS_ACCESS_KEY_ID}" ] || [ -z "${AWS_SECRET_ACCESS_KEY}" ]; then
            echo "::error::Set AWS_ACCESS_KEY_ID/SECRET or enable OIDC (STOCKS_RADAR_USE_OIDC + AWS_ROLE_ARN)"
            exit 1
          fi
          echo "Auth mode: access keys (consider migrating to OIDC — see GO_LIVE.md)"
        fi

    - name: Configure AWS credentials (OIDC)
      if: inputs.use-oidc == 'true'
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ inputs.role-arn }}
        aws-region: ${{ inputs.aws-region }}
        role-session-name: stockswatch-gha

    - name: Configure AWS credentials (access keys)
      if: inputs.use-oidc != 'true'
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ inputs.access-key-id }}
        aws-secret-access-key: ${{ inputs.secret-access-key }}
        aws-region: ${{ inputs.aws-region }}
